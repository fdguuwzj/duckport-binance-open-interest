[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-open-interest"
version = "0.2.0"
description = "Binance USD-M 5-minute open-interest ingestor (K-line labels) for duckport-rs"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    "duckdb==1.5.1",
]

[tool.setuptools.packages.find]
include = ["binance_open_interest*"]

[project.scripts]
binance-open-interest = "binance_open_interest.main:main"
